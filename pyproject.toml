[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-agents-platform"
version = "0.1.1"
description = "CLI + Server split agent platform with SSE streaming based on LangChain Deep Agents style architecture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "typer>=0.12.0",
  "sse-starlette>=2.1.0",
  "pydantic>=2.8.0",
  "langchain>=0.2.0",
]

[project.scripts]
deepagent-cli = "cli.main:app"

[tool.setuptools]
packages = ["cli", "server", "shared"]

[tool.uv]
package = false
